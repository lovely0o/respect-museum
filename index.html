function activateExhibitReactor(id){const orb=reactors[id];if(!orb)return;orb.material.color.setHex(0xffd76d);orb.material.emissive.setHex(0xffbd33);orb.material.emissiveIntensity=1.4;orb.scale.setScalar(1.5);}
function completeMissionStep(id,step){S.solved[id][step]=true;if(S.solved[id].every(Boolean))activateExhibitReactor(id);missionPage(id)}
function renderSingleGame(g,id,step){let selection=-1;open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="game-stage"><div class="stage-symbol">${rooms[id].emoji}</div><div class="choice-stack" id="options"></div></div><div class="info" id="feedback">전시에서 배운 내용을 생각해 보세요.</div><button class="primary" id="next" disabled>정답을 찾아보세요</button>`);const opt=$('options');g.choices.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{content.querySelectorAll('.choice-stack button').forEach(x=>x.classList.remove('good','bad'));const good=i===g.good;b.classList.add(good?'good':'bad');selection=i;$('feedback').textContent=good?'✅ 체험 장치가 반응합니다! '+g.feedback:'💡 다시 생각해 보세요. 전시 설명 속 기준을 떠올려 보세요.';$('next').disabled=!good};opt.appendChild(b)});$('next').onclick=()=>selection===g.good&&completeMissionStep(id,step)}
function renderMultiGame(g,id,step){const chosen=new Set();open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="mission-note">정답은 <strong>${g.need}개</strong>입니다.</div><div class="multi-grid" id="multiGrid"></div><div class="submit-row"><button class="mini-btn" id="checkBtn">확인하기</button><button class="primary" id="next" disabled>다음 단계 →</button></div><div class="info" id="feedback">카드를 눌러 선택해 보세요.</div>`);const grid=$('multiGrid');g.items.forEach(([txt,good],i)=>{const b=document.createElement('button');b.className='select-card';b.textContent=txt;b.onclick=()=>{if(chosen.has(i)){chosen.delete(i);b.classList.remove('active')}else{chosen.add(i);b.classList.add('active')}};grid.appendChild(b)});$('checkBtn').onclick=()=>{if(chosen.size!==g.need){$('feedback').textContent=`💡 ${g.need}개를 선택해 보세요.`;return}let ok=true;[...grid.children].forEach((b,i)=>{const good=g.items[i][1]===1,sel=chosen.has(i);b.classList.remove('good','bad');if(sel&&good)b.classList.add('good');else if(sel&&!good){b.classList.add('bad');ok=false}else if(!sel&&good)ok=false});$('feedback').textContent=ok?'✅ 체험 장치가 반응합니다! '+g.feedback:'💡 존중하거나 건강에 도움이 되는 선택만 골라 보세요.';$('next').disabled=!ok};$('next').onclick=()=>completeMissionStep(id,step)}
function renderSortGame(g,id,step){const assigned={};open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="sort-grid" id="sortGrid"></div><div class="submit-row"><button class="mini-btn" id="checkBtn">분류 확인</button><button class="primary" id="next" disabled>다음 단계 →</button></div><div class="info" id="feedback">각 카드 아래에서 알맞은 범주를 눌러 주세요.</div>`);const grid=$('sortGrid');g.cards.forEach(([text,cat],i)=>{const card=document.createElement('div');card.className='sort-card';card.innerHTML=`<h4>${text}</h4><div class="sort-actions"></div><div class="sort-result" id="result_${i}">아직 선택하지 않았어요.</div>`;const actions=card.querySelector('.sort-actions');g.categories.forEach((c,idx)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{assigned[i]=idx;actions.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('result_'+i).textContent=`선택: ${c}`};actions.appendChild(b)});grid.appendChild(card)});$('checkBtn').onclick=()=>{if(Object.keys(assigned).length<g.cards.length){$('feedback').textContent='💡 모든 카드를 분류해 보세요.';return}let wrong=0;g.cards.forEach(([_,cat],i)=>{if(assigned[i]!==cat)wrong++});const ok=wrong===0;$('feedback').textContent=ok?'✅ 체험 장치가 반응합니다! '+g.feedback:`💡 ${wrong}개의 카드가 다른 범주에 있어요. 다시 살펴보세요.`;$('next').disabled=!ok};$('next').onclick=()=>completeMissionStep(id,step)}
function renderMatchGame(g,id,step){let selectedLeft=null,matched=0;const rights=g.pairs.map((p,i)=>({text:p[1],idx:i})).sort(()=>Math.random()-.5);open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="match-board"><div class="match-col" id="leftCol"></div><div class="match-col" id="rightCol"></div></div><div class="info" id="feedback">왼쪽 카드 하나를 먼저 선택한 뒤 오른쪽 설명 카드를 고르세요.</div><div class="submit-row"><button class="primary" id="next" disabled>다음 단계 →</button></div>`);const left=$('leftCol'),right=$('rightCol');g.pairs.forEach(([text],i)=>{const b=document.createElement('button');b.className='match-item';b.textContent=text;b.onclick=()=>{if(b.classList.contains('done'))return;left.querySelectorAll('.match-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedLeft=i};left.appendChild(b)});rights.forEach(({text,idx})=>{const b=document.createElement('button');b.className='match-item';b.textContent=text;b.onclick=()=>{if(selectedLeft===null||b.classList.contains('done'))return;const leftBtn=left.children[selectedLeft];if(idx===selectedLeft){b.classList.add('done');leftBtn.classList.add('done');leftBtn.classList.remove('active');matched++;selectedLeft=null;$('feedback').textContent='✅ 잘 연결했어요. 남은 카드를 이어 보세요.';if(matched===g.pairs.length){$('feedback').textContent='✅ 체험 장치가 반응합니다! '+g.feedback;$('next').disabled=false}}else{$('feedback').textContent='💡 연결이 맞지 않아요. 전시 설명을 다시 떠올려 보세요.';leftBtn.classList.remove('active');selectedLeft=null}};right.appendChild(b)});$('next').onclick=()=>completeMissionStep(id,step)}
function renderDialogueGame(g,id,step){let selection=-1;open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="chat-sim"><div class="bubble left">${g.scenario[0]}</div><div class="bubble right">나는 어떻게 답할까?</div></div><div class="choice-stack" id="options"></div><div class="info" id="feedback">친구의 경계를 존중하는 표현을 골라 보세요.</div><button class="primary" id="next" disabled>다음 단계 →</button>`);const opt=$('options');g.choices.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{opt.querySelectorAll('button').forEach(x=>x.classList.remove('good','bad'));const good=i===g.good;b.classList.add(good?'good':'bad');selection=i;$('feedback').textContent=good?'✅ 체험 장치가 반응합니다! '+g.feedback:'💡 상대가 원하지 않는다면 멈추고 존중하는 답을 선택해 보세요.';$('next').disabled=!good};opt.appendChild(b)});$('next').onclick=()=>selection===g.good&&completeMissionStep(id,step)}
function renderClassifyGame(g,id,step){let selectedCard=null;const assigned={};open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="classify-wrap"><div class="classify-cards" id="classifyCards"></div><div class="bins" id="bins"></div></div><div class="info" id="feedback">카드를 하나 눌러 선택한 뒤 오른쪽 구역을 눌러 배치하세요.</div><div class="submit-row"><button class="mini-btn" id="checkBtn">분류 확인</button><button class="primary" id="next" disabled>다음 단계 →</button></div>`);const cards=$('classifyCards'),bins=$('bins');g.cards.forEach(([txt,cat],i)=>{const c=document.createElement('button');c.className='classify-card';c.textContent=txt;c.onclick=()=>{cards.querySelectorAll('.classify-card').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedCard=i};cards.appendChild(c)});g.bins.forEach((name,idx)=>{const b=document.createElement('button');b.className='bin';b.innerHTML=`<h4>${name}</h4><div id="bin_${idx}"></div>`;b.onclick=()=>{if(selectedCard===null)return;assigned[selectedCard]=idx;cards.children[selectedCard].classList.remove('active');selectedCard=null;updateBins()};bins.appendChild(b)});function updateBins(){g.bins.forEach((_,idx)=>{$('bin_'+idx).innerHTML=''});g.cards.forEach(([txt],i)=>{if(assigned[i]!==undefined){const chip=document.createElement('span');chip.className='chip';chip.textContent=txt;$('bin_'+assigned[i]).appendChild(chip)}})}$('checkBtn').onclick=()=>{if(Object.keys(assigned).length<g.cards.length){$('feedback').textContent='💡 모든 카드를 분류해 보세요.';return}let wrong=0;g.cards.forEach(([_,cat],i)=>{if(assigned[i]!==cat)wrong++});const ok=wrong===0;$('feedback').textContent=ok?'✅ 체험 장치가 반응합니다! '+g.feedback:`💡 ${wrong}개 카드의 구역을 다시 생각해 보세요.`;$('next').disabled=!ok};$('next').onclick=()=>completeMissionStep(id,step)}
function renderTrafficGame(g,id,step){const state={};open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="traffic-grid" id="trafficGrid"></div><div class="info" id="feedback">각 상황 아래에서 초록·노랑·빨강을 골라 주세요.</div><div class="submit-row"><button class="mini-btn" id="checkBtn">판단 확인</button><button class="primary" id="next" disabled>다음 단계 →</button></div>`);const grid=$('trafficGrid');g.items.forEach(([txt,good],i)=>{const card=document.createElement('div');card.className='traffic-card';card.innerHTML=`<h4>${txt}</h4><div class="lights"></div>`;const lights=card.querySelector('.lights');[['green','🟢'],['yellow','🟡'],['red','🔴']].forEach(([col,emoji])=>{const b=document.createElement('button');b.className=`light-btn ${col}`;b.title=emoji;b.onclick=()=>{state[i]=col;lights.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};lights.appendChild(b)});grid.appendChild(card)});$('checkBtn').onclick=()=>{if(Object.keys(state).length<g.items.length){$('feedback').textContent='💡 모든 상황에 신호를 표시해 보세요.';return}let wrong=0;g.items.forEach(([_,good],i)=>{if(state[i]!==good)wrong++});const ok=wrong===0;$('feedback').textContent=ok?'✅ 체험 장치가 반응합니다! '+g.feedback:`💡 ${wrong}개 상황의 신호를 다시 생각해 보세요.`;$('next').disabled=!ok};$('next').onclick=()=>completeMissionStep(id,step)}
function renderOrderGame(g,id,step){const order=[...g.steps].reverse(),picked=[];open(`<div class="eyebrow">${id}관 ${rooms[id].name} · 체험 ${step+1}/2</div><h2>${rooms[id].emoji} ${g.title}</h2><p>${g.intro}</p><div class="order-stage"><div class="order-bank" id="bank"></div><div class="order-target"><strong>선택한 순서</strong><div class="order-result" id="result"></div></div></div><div class="info" id="feedback">가장 먼저 해야 할 행동부터 차례대로 눌러 보세요.</div><div class="submit-row"><button class="mini-btn" id="resetBtn">다시 하기</button><button class="primary" id="next" disabled>완료 →</button></div>`);const bank=$('bank');function rerender(){bank.innerHTML='';order.forEach((txt,i)=>{if(picked.includes(txt))return;const b=document.createElement('button');b.className='order-chip';b.textContent=txt;b.onclick=()=>{const expected=g.steps[picked.length];if(txt===expected){picked.push(txt);const tag=document.createElement('div');tag.className='order-chip';tag.innerHTML=`<span class="order-num">${picked.length}</span>${txt}`;$('result').appendChild(tag);rerender();if(picked.length===g.steps.length){$('feedback').textContent='✅ 체험 장치가 반응합니다! '+g.feedback;$('next').disabled=false}}else{picked.length=0;$('result').innerHTML='';$('feedback').textContent='💡 순서가 달랐어요. 가장 먼저 해야 하는 행동부터 다시 골라 보세요.';rerender()}};bank.appendChild(b)})}rerender();$('resetBtn').onclick=()=>{picked.length=0;$('result').innerHTML='';$('feedback').textContent='순서를 다시 만들어 보세요.';$('next').disabled=true;rerender()};$('next').onclick=()=>completeMissionStep(id,step)}
function missionPage(id){if(S.solved[id].every(Boolean)){S.stamps.add(id);$('counter').textContent=`🎟️ 인증 도장 ${S.stamps.size} / 6`;showStamp(id);return}const step=S.solved[id][0]?1:0,g=games[id][step];if(g.type==='single')return renderSingleGame(g,id,step);if(g.type==='multi')return renderMultiGame(g,id,step);if(g.type==='sort')return renderSortGame(g,id,step);if(g.type==='match')return renderMatchGame(g,id,step);if(g.type==='dialogue')return renderDialogueGame(g,id,step);if(g.type==='classify')return renderClassifyGame(g,id,step);if(g.type==='traffic')return renderTrafficGame(g,id,step);if(g.type==='order')return renderOrderGame(g,id,step)}
function showStamp(id){const r=rooms[id];open(`<div class="eyebrow">박물관 인증 완료</div><div style="text-align:center"><div class="bigstamp">${r.emoji}</div><h1>${id}관 인증 도장 획득!</h1><p>${r.name} 전시 관람을 마쳤어요.</p><div class="info">🎟️ 현재 ${S.stamps.size}/6개 인증 · 각 관 체험대의 고유 미션까지 완료했어요.</div><button class="primary" id="finish">계속 탐험하기</button></div>`);$('finish').onclick=()=>{if(S.stamps.size===6&&!S.badge)showHall();else close()}}
const finals=[
{title:'서로 다른 성장 속도',q:'사춘기 변화가 친구보다 늦어 고민하는 친구에게 어떤 말을 해줄까요?',a:['너만 늦은 것 같아','사람마다 성장 시기가 달라. 걱정되면 어른과 이야기해 보자','다른 친구와 비교해 봐'],good:1,why:'성장 속도는 사람마다 다르며 존중받아야 합니다.'},
{title:'친구의 경계 존중',q:'친구가 “그 장난은 싫어”라고 말했을 때 가장 알맞은 행동은?',a:['그만하고 친구의 의사를 존중한다','친하면 괜찮다고 설득한다','장난이니까 계속한다'],good:0,why:'동의하지 않는 행동은 즉시 멈춰야 합니다.'},

function showHall(){if(S.stamps.size!==6){toast(`인증 도장 ${6-S.stamps.size}개가 더 필요해요.`);return}if(S.badge){showBadge();return}const idx=S.finalSolved.findIndex(x=>!x);if(idx<0){S.badge=true;showBadge();return}const g=finals[idx];open(`<div class="eyebrow">🏛️ 명예의 전당 · 마지막 도전 ${idx+1}/3</div><h2>${g.title}</h2><div class="info">${g.q}</div><div id="hallOptions"></div><div class="info" id="hallFeedback">배운 내용을 떠올려 가장 안전하고 존중하는 행동을 골라 보세요.</div><button class="primary" id="hallNext" disabled>정답을 선택하세요</button>`);g.a.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${i+1}. ${a}`;b.onclick=()=>{content.querySelectorAll('.choice').forEach(x=>x.classList.remove('good','bad'));b.classList.add(i===g.good?'good':'bad');$('hallFeedback').textContent=i===g.good?'✅ '+g.why:'💡 전시에서 배운 존중과 안전의 기준을 떠올려 다시 선택해 보세요.';$('hallNext').disabled=i!==g.good;$('hallNext').textContent=i===g.good?'다음 단계 →':'정답을 선택하세요'};$('hallOptions').appendChild(b)});$('hallNext').onclick=()=>{S.finalSolved[idx]=true;showHall()}}
function showBadge(){open(`<div style="text-align:center"><div class="eyebrow">MUSEUM MASTER BADGE</div><div class="award">🏅</div><h1>성 존중 마스터!</h1><p>6개 전시관과 최종 미션을 모두 완수했어요.</p><div class="info">💎 존중 · 🌱 성장 · 🧬 건강 · 🤝 경계 · 🛡️ 안전 · 🔐 디지털 책임<br><strong>나는 나와 타인의 마음과 경계를 존중하겠습니다.</strong></div><div class="row" style="justify-content:center"><button class="primary" id="saveBadge">🏅 배지 이미지 저장</button><button class="primary" id="revisit">자유 관람 계속하기</button></div><p class="subtle">개인정보 없이 발급되는 기념 배지입니다.</p></div>`);$('saveBadge').onclick=saveBadge;$('revisit').onclick=close}
function saveBadge(){let c=document.createElement('canvas');c.width=1000;c.height=700;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,1000,700);g.addColorStop(0,'#f0eafa');g.addColorStop(1,'#fff4d9');x.fillStyle=g;x.fillRect(0,0,1000,700);x.fillStyle='#564993';x.textAlign='center';x.font='bold 48px sans-serif';x.fillText('존중과 배려의 성 박물관',500,130);x.font='150px serif';x.fillText('🏅',500,340);x.font='bold 66px sans-serif';x.fillText('성 존중 마스터',500,448);x.font='32px sans-serif';x.fillText('6개 전시관 · 최종 미션 완료',500,514);x.font='24px sans-serif';x.fillText('나와 타인의 마음과 경계를 존중합니다.',500,575);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='성존중_마스터배지.png';a.click()}
const roomLabels=['💎 1관 존중의 가치관','🌱 2관 성장의 비밀','🧬 3관 건강 관리','🤝 4관 존중의 거리','🛡️ 5관 친구 관계','🔐 6관 디지털 안전'];
function showMap(){open(`<div class="eyebrow">MUSEUM MAP</div><h2>🗺️ 박물관 안내도</h2><p class="subtle">6개 전시관 모두 개관 · 자유롭게 탐험하세요.</p><div class="mapgrid">${roomLabels.map((s,i)=>`<button   data-room="${i+1}">${s}<br><small>${S.stamps.has(i+1)?'✅ 인증 완료':'입장 가능'}</small></button>`).join('')}</div><div class="footer"><button class="primary" id="lobby">🏛️ 중앙 로비로</button></div>`);content.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>teleport(+b.dataset.room));$('lobby').onclick=()=>teleport(0);const hallBtn=document.createElement('button');hallBtn.className='primary';hallBtn.textContent='🏆 명예의 전당';hallBtn.onclick=showHall;content.querySelector('.footer').appendChild(hallBtn)}
function showPassport(){open(`<div class="eyebrow">MUSEUM PASSPORT</div><h2>📖 나의 박물관 여권</h2><p>각 관에서 전시물 2개 이상 관람하고 미션 2개를 맞히면 도장을 받습니다.</p><div class="gallery">${roomLabels.map((name,i)=>`<button class="${S.stamps.has(i+1)?'active':''}" data-go="${i+1}"><div class="stamp">${S.stamps.has(i+1)?rooms[i+1].emoji:'🔒'}</div><strong>${name}</strong><br><small>${S.stamps.has(i+1)?'인증 완료':'관람 가능'}</small></button>`).join('')}</div><div class="info">🏅 ${S.badge?'마스터 배지 획득 완료!':S.stamps.size===6?'6개 도장 완료! 명예의 전당으로 이동해요.':'6개 도장을 모으면 명예의 전당에 입장할 수 있어요.'}</div><div class="footer"><button class="primary" id="hallGo">🏆 명예의 전당</button></div>`);$('hallGo').onclick=showHall;content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>teleport(+b.dataset.go))}
$('lobbyQuickBtn').onclick=()=>teleport(0);$('mapBtn').onclick=showMap;$('passportBtn').onclick=showPassport;$('interactBtn').onclick=()=>near&&near.fn();$('enter').onclick=()=>{$('start').classList.add('hidden');S.paused=false;toast('전시관으로 걸어가거나 지도를 눌러 보세요.')};document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)&&!S.paused)e.preventDefault();if(!S.paused)keys.add(e.code);if(e.code==='KeyE'&&!S.paused&&near)near.fn();if(e.code==='Escape'&&!overlay.classList.contains('hidden'))close()});document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden)keys.clear()});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});const stop=()=>keys.delete(k);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)});if(new URLSearchParams(location.search).has('selftest'))window.__museumTest={S,teleport,showExhibit,showMission,completeMissionStep,showHall,showBadge,saveBadge};if(!window.THREE){$('start').innerHTML='<div class="modal"><h1>3D 라이브러리를 불러오지 못했습니다.</h1><p>인터넷 연결 후 다시 시도해 주세요. 일부 학교 네트워크에서는 외부 라이브러리가 차단될 수 있습니다.</p><button class="primary" onclick="location.reload()">다시 시도</button></div>';return}init();
})();</script></body></html>
